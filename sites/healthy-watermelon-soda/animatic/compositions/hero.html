  </div>
  <script>
    (function () {
      /* ---------- shared timing (seconds, scene-local) ---------- */
      const T = { cut0: 2.2, cut1: 5.4, part1: 6.6, seed0: 6.3, col0: 9.0, col1: 10.6, glass0: 12.2, glass1: 13.1, pour0: 13.1, pour1: 15.4, wedge0: 15.5, wedge1: 16.2 };
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const sineIO = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
      const p3o = (x) => 1 - Math.pow(1 - x, 3);
      const expoO = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
      const p2io = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      const backO = (x) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
      const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

      /* ---------- DOM timeline ---------- */
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hero-gl", { scaleX: 0.5 }, { scaleX: 0.5, duration: 0.01 }, 0);
      tl.fromTo(["#hero-headL", "#hero-headR"], { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "expo.out", stagger: 0.09 }, 0.15);
      tl.fromTo(["#hero-fact", "#hero-cta"], { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out", stagger: 0.08 }, 0.55);
      tl.fromTo("#hero-line", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.8, ease: "expo.out" }, 0.05);
      tl.fromTo("#hero-tick", { y: 360, opacity: 0 }, { y: 360, opacity: 1, duration: 0.4 }, 1.4);
      tl.fromTo("#hero-tick", { y: 360 }, { y: 880, duration: T.cut1 - T.cut0, ease: "sine.inOut" }, T.cut0);
      tl.fromTo("#hero-tick", { opacity: 1 }, { opacity: 0, duration: 0.4 }, T.cut1 + 0.2);
      /* collapse: the divider sweeps left, fizz takes the screen */
      tl.fromTo("#hero-gl", { scaleX: 0.5 }, { scaleX: 0, duration: T.col1 - T.col0, ease: "power2.inOut", immediateRender: false }, T.col0);
      tl.fromTo("#hero-line", { x: 0 }, { x: -962, duration: T.col1 - T.col0, ease: "power2.inOut" }, T.col0);
      tl.fromTo("#hero-headL", { x: 0, opacity: 1 }, { x: -120, opacity: 0, duration: 0.6, ease: "power2.in", immediateRender: false }, T.col0);
      tl.fromTo("#hero-fact", { opacity: 1 }, { opacity: 0, duration: 0.5, immediateRender: false }, T.col0);
      tl.fromTo("#hero-close", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 10.1);
      tl.fromTo("#hero-close", { y: 0, opacity: 1 }, { y: -50, opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, 11.8);
      tl.fromTo("#hero-pour", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 16.3);
      /* cursor finds the CTA, hover sweep, press */
      tl.fromTo("#hero-cursor", { x: 1420, y: 760, opacity: 0 }, { x: 1420, y: 760, opacity: 1, duration: 0.25 }, 17.5);
      tl.fromTo("#hero-cursor", { x: 1420, y: 760 }, { x: 1740, y: 1050, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 17.75);
      tl.fromTo("#hero-ctaFill", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, 18.42);
      tl.fromTo("#hero-ctaArrow", { x: 0 }, { x: 7, duration: 0.32, ease: "power3.out" }, 18.42);
      tl.fromTo("#hero-cta", { scale: 1 }, { scale: 0.95, duration: 0.1, ease: "power2.out", immediateRender: false }, 19.0);
      tl.fromTo("#hero-cta", { scale: 0.95 }, { scale: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, 19.1);
      /* scroll to the How section */
      tl.fromTo("#hero-scroll", { y: 0 }, { y: -1080, duration: 0.75, ease: "power3.inOut" }, 19.6);
      window.__timelines["hero"] = tl;

      /* ---------- three.js scene ---------- */
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let renderAt = null;
      let lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; if (renderAt) renderAt(lastT); });

      const ready = new Promise((res) => {
        if (window.__THREE) res(window.__THREE);
        else window.addEventListener("three-ready", () => res(window.__THREE), { once: true });
      }).then(build);
      window.__hf.buildReady["hero3d"] = ready;

      function hash(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
      function vnoise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      }
      function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= 0.5; } return s; }
      function rnd(i, k) { return hash(i * 17.17 + 3.1, k * 9.73 + 1.7); }
      const mix = (a, b, t) => a + (b - a) * t;

      function rindCanvas() {
        const W = 1024, H = 512, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
        const ctx = cv.getContext("2d"), img = ctx.createImageData(W, H), d = img.data;
        const N = 16;
        for (let y = 0; y < H; y++) {
          const v = y / H;
          for (let x = 0; x < W; x++) {
            const uu = (x / W) * N, k = Math.floor(uu), fr = uu - k, dist = Math.abs(fr - 0.5);
            const kk = k % N;
            const hw = 0.27 + 0.12 * (fbm(kk * 7.3, v * 7) - 0.5) * 2 + 0.09 * (vnoise(kk * 3.1, v * 55) - 0.5) * 2 + 0.04 * (vnoise(kk * 5.7, v * 160) - 0.5) * 2;
            const m = fbm(x * 0.05, y * 0.05, 3);
            const fleck = vnoise(x * 0.16 + kk, y * 0.16);
            let r = mix(150, 196, m), g = mix(172, 206, m), b = mix(96, 134, m);
            const edge = smooth(hw + 0.035, hw - 0.005, dist);
            let s = edge;
            if (dist < hw + 0.16 && fleck > 0.55) s = Math.max(s, 0.7 * smooth(hw + 0.16, hw, dist));
            const vein = vnoise(x * 0.5, y * 0.03 + kk); if (s < 0.5 && vein > 0.82) s = Math.max(s, 0.35);
            const dr = mix(18, 40, m), dg = mix(52, 86, m), db = mix(18, 32, m);
            r = mix(r, dr, s); g = mix(g, dg, s); b = mix(b, db, s);
            const i = (y * W + x) * 4; d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        return cv;
      }

      function capCanvas() {
        const S = 1024, cv = document.createElement("canvas"); cv.width = S; cv.height = S;
        const ctx = cv.getContext("2d"), img = ctx.createImageData(S, S), d = img.data;
        for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
          const dx = (x - S / 2) / (S / 2), dy = (y - S / 2) / (S / 2), r = Math.hypot(dx, dy), an = Math.atan2(dy, dx);
          let R, G, B;
          const grain = fbm(an * 26 + 3, r * 9, 3), fib = vnoise(an * 120, r * 3);
          // flesh
          R = mix(206, 236, grain) + (fib - 0.5) * 18; G = mix(44, 78, grain); B = mix(52, 74, grain);
          const heart = smooth(0.32, 0.0, r); R = mix(R, 238, heart * 0.35); G = mix(G, 92, heart * 0.35); B = mix(B, 92, heart * 0.35);
          // pale rind band and skin
          const toRind = smooth(0.8, 0.9, r);
          R = mix(R, 226, toRind); G = mix(G, 232, toRind); B = mix(B, 196, toRind);
          const skin = smooth(0.955, 0.975, r);
          R = mix(R, 52, skin); G = mix(G, 104, skin); B = mix(B, 44, skin);
          if (r > 1) { R = 52; G = 104; B = 44; }
          const i = (y * S + x) * 4; d[i] = R; d[i + 1] = G; d[i + 2] = B; d[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        // seeds: six lobes of teardrops
        for (let k = 0; k < 6; k++) for (let j = 0; j < 7; j++) {
          const id = k * 7 + j;
          const an = (k / 6) * Math.PI * 2 + 0.3 + (rnd(id, 1) - 0.5) * 0.5;
          const rr = 0.42 + j * 0.045 + (rnd(id, 2) - 0.5) * 0.05;
          const cx = S / 2 + Math.cos(an) * rr * S / 2, cy = S / 2 + Math.sin(an) * rr * S / 2;
          ctx.save(); ctx.translate(cx, cy); ctx.rotate(an);
          ctx.fillStyle = "#1c0d0b"; ctx.beginPath(); ctx.ellipse(0, 0, 15, 8.5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.beginPath(); ctx.ellipse(-3, -2.5, 5, 2, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
        return cv;
      }

      function radialCanvas() {
        const cv = document.createElement("canvas"); cv.width = cv.height = 256;
        const ctx = cv.getContext("2d"), g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, "rgba(42,14,18,0.55)"); g.addColorStop(0.5, "rgba(42,14,18,0.2)"); g.addColorStop(1, "rgba(42,14,18,0)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256); return cv;
      }

      function build({ THREE, RoomEnvironment, RoundedBoxGeometry }) {
        const canvas = document.getElementById("hero-canvas");
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1); renderer.setSize(1920, 1080, false);
        renderer.setClearColor(0x000000, 0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        const camera = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.1, 100);

        const key = new THREE.DirectionalLight(0xfff0de, 2.4); key.position.set(-4, 6, 6); scene.add(key);
        const rim = new THREE.DirectionalLight(0xdfe8ff, 1.6); rim.position.set(5, 3, -5); scene.add(rim);
        scene.add(new THREE.AmbientLight(0xffffff, 0.25));

        const rindTex = new THREE.CanvasTexture(rindCanvas()); rindTex.colorSpace = THREE.SRGBColorSpace; rindTex.anisotropy = 8;
        const capTex = new THREE.CanvasTexture(capCanvas()); capTex.colorSpace = THREE.SRGBColorSpace; capTex.anisotropy = 8;
        const rindMat = new THREE.MeshPhysicalMaterial({ map: rindTex, bumpMap: rindTex, bumpScale: 0.6, roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.4, envMapIntensity: 0.7 });
        const capMat = new THREE.MeshPhysicalMaterial({ map: capTex, bumpMap: capTex, bumpScale: 0.8, roughness: 0.36, clearcoat: 0.8, clearcoatRoughness: 0.18, envMapIntensity: 0.6 });

        /* melon: long axis along x, cut plane x = 0 */
        const A = 1.55, B = 1.05;
        function shellGeo(top) {
          const g = new THREE.SphereGeometry(1, 160, 96, 0, Math.PI * 2, top ? 0 : Math.PI / 2, Math.PI / 2);
          g.scale(B, A, B); g.rotateZ(-Math.PI / 2); return g; // top -> right half (x >= 0)
        }
        const capGeoL = new THREE.CircleGeometry(B, 160); capGeoL.rotateY(Math.PI / 2);
        const capGeoR = new THREE.CircleGeometry(B, 160); capGeoR.rotateY(-Math.PI / 2);

        const melon = new THREE.Group(); scene.add(melon);
        function makeSide(top, capGeo) {
          const side = new THREE.Group(), hinge = new THREE.Group(), body = new THREE.Group();
          hinge.position.set(0, -B, 0); body.position.set(0, B, 0);
          body.add(new THREE.Mesh(shellGeo(top), rindMat));
          body.add(new THREE.Mesh(capGeo, capMat));
          hinge.add(body); side.add(hinge); melon.add(side);
          return { side, hinge, body };
        }
        const L = makeSide(false, capGeoL), R = makeSide(true, capGeoR);

        /* knife glint along the front meridian */
        const arc = new THREE.Curve(); arc.getPoint = (s) => new THREE.Vector3(0, Math.cos(s * Math.PI) * B * 1.004, Math.sin(s * Math.PI) * B * 1.004);
        const SEG = 120, RS = 8;
        const glintGeo = new THREE.TubeGeometry(arc, SEG, 0.009, RS, false);
        const glint = new THREE.Mesh(glintGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
        melon.add(glint);

        /* floor shadows */
        const shadowTex = new THREE.CanvasTexture(radialCanvas());
        const shadowMat = () => new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
        const floorY = -1.42;
        const mShadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shadowMat()); mShadow.rotation.x = -Math.PI / 2; mShadow.position.y = floorY; scene.add(mShadow);
        const gShadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shadowMat()); gShadow.rotation.x = -Math.PI / 2; gShadow.position.y = floorY; scene.add(gShadow);

        /* seeds and juice */
        const seedGeo = new THREE.SphereGeometry(1, 20, 14); seedGeo.scale(0.07, 0.042, 0.022);
        const NS = 14, seeds = new THREE.InstancedMesh(seedGeo, new THREE.MeshPhysicalMaterial({ color: 0x1b0c0a, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.1 }), NS);
        scene.add(seeds);
        const dropGeo = new THREE.SphereGeometry(1, 16, 12);
        const ND = 60, drops = new THREE.InstancedMesh(dropGeo, new THREE.MeshPhysicalMaterial({ color: 0xe23a4b, roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.2 }), ND);
        scene.add(drops);
        const dummy = new THREE.Object3D();

        /* glass, liquid, ice, bubbles, stream, wedge */
        const glassG = new THREE.Group(); scene.add(glassG);
        const GH = 2.25, GR = 0.6;
        const prof = [[0, 0], [GR - 0.04, 0], [GR, 0.04], [GR + 0.02, GH], [GR - 0.005, GH + 0.02], [GR - 0.03, GH], [GR - 0.05, 0.32], [0, 0.3]].map(([r, y]) => new THREE.Vector2(r, y));
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.04, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 2.6, transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide });
        const glass = new THREE.Mesh(new THREE.LatheGeometry(prof, 128), glassMat); glass.renderOrder = 3; glassG.add(glass);
        const rimRing = new THREE.Mesh(new THREE.TorusGeometry(GR + 0.005, 0.012, 12, 128), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.05, envMapIntensity: 3, transparent: true, opacity: 0.7 }));
        rimRing.rotation.x = Math.PI / 2; rimRing.position.y = GH + 0.01; glassG.add(rimRing);
        const baseDisk = new THREE.Mesh(new THREE.CylinderGeometry(GR - 0.02, GR, 0.3, 96), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.06, envMapIntensity: 2.4, transparent: true, opacity: 0.32, depthWrite: false }));
        baseDisk.position.y = 0.15; glassG.add(baseDisk);
        const liqH = GH - 0.55;
        const liqGeo = new THREE.CylinderGeometry(GR - 0.065, GR - 0.07, 1, 96); liqGeo.translate(0, 0.5, 0);
        const liquid = new THREE.Mesh(liqGeo, new THREE.MeshPhysicalMaterial({ color: 0xe0223a, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 1.2, transparent: true, opacity: 0.8, depthWrite: false }));
        liquid.position.y = 0.31; glassG.add(liquid);
        const iceMat = new THREE.MeshPhysicalMaterial({ color: 0xfbe3e6, roughness: 0.12, clearcoat: 1, envMapIntensity: 2.2, transparent: true, opacity: 0.55 });
        const ice = [0, 1, 2].map((i) => { const m = new THREE.Mesh(new RoundedBoxGeometry(0.36, 0.32, 0.34, 4, 0.07), iceMat); glassG.add(m); return m; });
        const NB = 80, bubbles = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75, depthTest: false }), NB);
        bubbles.renderOrder = 2; glassG.add(bubbles);
        const streamGeo = new THREE.CylinderGeometry(0.06, 0.075, 1, 24); streamGeo.translate(0, -0.5, 0);
        const stream = new THREE.Mesh(streamGeo, liquid.material); glassG.add(stream);
        // wedge garnish
        const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.absarc(0, 0, 0.78, Math.PI * 0.34, Math.PI * 0.66, false); sh.lineTo(0, 0);
        const wedgeGeo = new THREE.ExtrudeGeometry(sh, { depth: 0.13, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 2, curveSegments: 24 });
        wedgeGeo.translate(0, 0, -0.065);
        const wTex = capTex.clone(); wTex.needsUpdate = true; wTex.repeat.set(1 / 1.56, 1 / 1.56); wTex.offset.set(0.5, 0.5);
        const wedge = new THREE.Mesh(wedgeGeo, [new THREE.MeshPhysicalMaterial({ map: wTex, roughness: 0.35, clearcoat: 0.8 }), new THREE.MeshPhysicalMaterial({ color: 0x2f6b2a, roughness: 0.45 })]);
        glassG.add(wedge);

        renderAt = function (t) {
          const c = sineIO(prog(t, T.cut0, T.cut1));
          const p = p3o(prog(t, T.cut1, T.part1));
          const k = prog(t, T.col0, T.col1);
          const intro = expoO(prog(t, 0.1, 1.4));

          /* camera: slow push all film long */
          camera.position.set(0, 1.0, 9.4 - 0.5 * clamp(t / 19));
          camera.lookAt(0, -0.35, 0);

          /* melon */
          melon.visible = t < T.col1 + 0.4;
          melon.position.set(0, -0.42 + (1 - intro) * -0.6 - 4.2 * Math.pow(smooth(T.col0, T.col1, t), 2), 0);
          melon.rotation.set(0.32 + 0.05 * Math.sin(t * 0.6), 0, 0);
          const hingeA = 0.075 * c * (1 - p);
          L.hinge.rotation.z = hingeA; R.hinge.rotation.z = -hingeA;
          const lift = 0.08 * Math.sin(Math.PI * p);
          L.side.position.set(-0.7 * p - 1.2 * smooth(T.col0, T.col1, t), lift, 0);
          R.side.position.set(0.7 * p + 1.2 * smooth(T.col0, T.col1, t), lift, 0);
          L.side.rotation.set(0.25 * k, -0.95 * p, 0.6 * k);
          R.side.rotation.set(0.25 * k, 0.95 * p, -0.6 * k);
          // glint: draws from the top to the tip while cutting
          const segDone = Math.round(SEG * c);
          glint.visible = c > 0 && p < 0.2;
          glintGeo.setDrawRange(0, segDone * RS * 6);
          glint.material.opacity = 0.9 * (1 - smooth(0.85, 1, c));
          const mS = 1 - smooth(T.col0, T.col0 + 0.8, t);
          mShadow.scale.set((3.4 + 1.6 * p) * mS + 0.001, 1.3 * mS + 0.001, 1);

          /* seeds rise along the divider */
          for (let i = 0; i < NS; i++) {
            const te = T.seed0 + i * 0.14, life = (t - te) / 2.3;
            if (life < 0 || life > 1) { dummy.scale.setScalar(0); }
            else {
              const e = Math.sin(life * Math.PI / 2), side = i % 2 ? 1 : -1;
              const ox = side * (0.35 + rnd(i, 1) * 0.3), oy = -0.5 + (rnd(i, 2) - 0.5) * 1.2;
              dummy.position.set(ox * (1 - e) + Math.sin(life * 6 + i) * 0.12, oy + e * 4.6, 0.7 + e * 0.8);
              dummy.rotation.set(life * 8 + i, life * 5 + i * 2, life * 6);
              dummy.scale.setScalar((0.9 + rnd(i, 3) * 0.5) * (1 - smooth(0.82, 1, life)));
            }
            dummy.updateMatrix(); seeds.setMatrixAt(i, dummy.matrix);
          }
          seeds.instanceMatrix.needsUpdate = true;

          /* juice: a spray at the knife tip while cutting, a burst when the halves part */
          for (let i = 0; i < ND; i++) {
            let vis = false;
            if (i < 32) {
              const te = T.cut0 + 0.25 + (i / 32) * (T.cut1 - T.cut0 - 0.4), dt = t - te;
              if (dt >= 0 && dt < 1.0) {
                const ce = sineIO(prog(te, T.cut0, T.cut1)), yl = 1 - 2 * ce;
                const zl = Math.sqrt(Math.max(0, 1 - yl * yl));
                const ox = 0, oy = -0.42 + yl * Math.cos(0.32) - zl * Math.sin(0.32), oz = yl * Math.sin(0.32) + zl * Math.cos(0.32);
                const vx = (rnd(i, 4) - 0.5) * 1.6, vy = 0.8 + rnd(i, 5) * 1.4, vz = 0.6 + rnd(i, 6) * 1.2;
                dummy.position.set(ox + vx * dt, oy + vy * dt - 4.9 * dt * dt, oz + vz * dt);
                dummy.scale.setScalar((0.018 + rnd(i, 7) * 0.026) * (1 - smooth(0.7, 1, dt)));
                vis = true;
              }
            } else {
              const j = i - 32, te = T.cut1 + j * 0.012, dt = t - te;
              if (dt >= 0 && dt < 1.2) {
                const side = j % 2 ? 1 : -1;
                const vx = side * (1.2 + rnd(j, 8) * 1.8), vy = 0.8 + rnd(j, 9) * 2.4, vz = 0.4 + rnd(j, 10) * 1.6;
                dummy.position.set(side * 0.1 + vx * dt, -0.42 + (rnd(j, 11) - 0.5) * 1.4 + vy * dt - 4.9 * dt * dt, 0.3 + vz * dt);
                dummy.scale.setScalar((0.02 + rnd(j, 12) * 0.035) * (1 - smooth(0.8, 1.2, dt)));
                vis = true;
              }
            }
            if (!vis) dummy.scale.setScalar(0);
            dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); drops.setMatrixAt(i, dummy.matrix);
          }
          drops.instanceMatrix.needsUpdate = true;

          /* glass rises in, fills, fizzes */
          const g = expoO(prog(t, T.glass0, T.glass1));
          glassG.visible = t >= T.glass0;
          glassG.position.set(0, floorY - 5 * (1 - g), 0);
          glassG.rotation.set(0, -0.3 + 0.12 * clamp((t - T.glass0) / 7), 0);
          const fill = sineIO(prog(t, T.pour0 + 0.15, T.pour1));
          const surf = 0.31 + liqH * fill;
          liquid.scale.y = Math.max(0.0001, liqH * fill);
          liquid.visible = fill > 0.002;
          ice.forEach((m, i) => {
            const base = 0.32 + 0.2 + i * 0.05;
            const y = Math.max(base, surf - 0.2 - i * 0.12) + 0.02 * Math.sin(t * 1.7 + i * 2);
            m.position.set([-0.18, 0.2, -0.02][i], y, [0.12, -0.08, -0.22][i]);
            m.rotation.set(0.3 + i, 0.6 * i + 0.1 * Math.sin(t + i), 0.2 * i);
          });
          // stream: from above frame down to the surface
          const s0 = prog(t, T.pour0, T.pour0 + 0.3), s1 = prog(t, T.pour1 - 0.3, T.pour1);
          const top = 6 - (6 - surf) * s1, bot = 6 - (6 - surf) * s0;
          stream.visible = t > T.pour0 && t < T.pour1 && top - bot > 0.01;
          stream.position.set(-0.08, top, 0.05);
          stream.scale.set(1 + 0.08 * Math.sin(t * 40), Math.max(0.001, top - bot), 1);
          for (let i = 0; i < NB; i++) {
            const a = rnd(i, 13) * Math.PI * 2, rr = Math.sqrt(rnd(i, 14)) * (GR - 0.14);
            const sp = 0.35 + rnd(i, 15) * 0.5, ph = rnd(i, 16);
            const h = surf - 0.34;
            let y = 0.34 + ((ph + (t - T.pour0) * sp / Math.max(h, 0.2)) % 1) * h;
            const on = t > T.pour0 + 0.6 && h > 0.15;
            dummy.position.set(Math.cos(a) * rr + 0.02 * Math.sin(t * 3 + i), y, Math.sin(a) * rr);
            dummy.scale.setScalar(on ? 0.012 + rnd(i, 17) * 0.02 : 0);
            dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); bubbles.setMatrixAt(i, dummy.matrix);
          }
          bubbles.instanceMatrix.needsUpdate = true;
          const w = prog(t, T.wedge0, T.wedge1);
          wedge.visible = t > T.wedge0;
          wedge.position.set(0.12, GH - 0.62 + 2.5 * (1 - backO(w)), 0.0);
          wedge.rotation.set(0.1, -0.35, -0.62 + 0.5 * (1 - w));
          const gS = g * (1 - 0) ;
          gShadow.scale.set(2.0 * gS + 0.001, 0.8 * gS + 0.001, 1);

          renderer.render(scene, camera);
        };
        return renderer.compileAsync(scene, camera).then(() => renderAt(lastT));
      }
    })();
  </script>
</template>
