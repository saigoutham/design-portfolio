<template>
  <style>

  </style>
  <div id="root" data-composition-id="hero" data-width="1920" data-height="1080">
    <div id="hero-wrap" class="clip" data-start="0" data-duration="20.4" data-layout-allow-overlap data-layout-allow-overflow>

      </div>

  </div>
  <script>
    (function () {
      /* ---------- shared timing (seconds, scene-local) ---------- */
      const T = { cut0: 2.2, cut1: 5.4, part1: 6.6, seed0: 6.3, col0: 9.0, col1: 10.6, glass0: 12.2, glass1: 13.1, pour0: 13.1, pour1: 15.4, wedge0: 15.5, wedge1: 16.2 };
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const sineIO = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
      const p3o = (x) => 1 - Math.pow(1 - x, 3);
      const expoO = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
      const p2io = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      const backO = (x) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
      const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

      /* ---------- DOM timeline ---------- */
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(["#hero-headL", "#hero-headR"], { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "expo.out", stagger: 0.09 }, 0.15);
      tl.fromTo(["#hero-fact", "#hero-cta"], { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out", stagger: 0.08 }, 0.55);
      tl.fromTo("#hero-line", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.8, ease: "expo.out" }, 0.05);
      tl.fromTo(["#hero-headL", "#hero-headR"], { yPercent: 0 }, { yPercent: -14, duration: T.col0 - 1.2, ease: "none" }, 1.2);
      tl.fromTo("#hero-tick", { y: 360, opacity: 0 }, { y: 360, opacity: 1, duration: 0.4 }, 1.4);
      tl.fromTo("#hero-tick", { y: 360 }, { y: 880, duration: T.cut1 - T.cut0, ease: "sine.inOut" }, T.cut0);
      tl.fromTo("#hero-tick", { opacity: 1 }, { opacity: 0, duration: 0.4 }, T.cut1 + 0.2);
      /* collapse: the divider sweeps left, fizz takes the screen */
      tl.fromTo("#hero-line", { x: 0 }, { x: -962, duration: T.col1 - T.col0, ease: "power2.inOut" }, T.col0);
      tl.fromTo("#hero-headL", { x: 0, opacity: 1 }, { x: -120, opacity: 0, duration: 0.6, ease: "power2.in", immediateRender: false }, T.col0);
      tl.fromTo("#hero-fact", { opacity: 1 }, { opacity: 0, duration: 0.5, immediateRender: false }, T.col0);
      tl.fromTo("#hero-close", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 10.1);
      tl.fromTo("#hero-close", { y: 0, opacity: 1 }, { y: -50, opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, 11.8);
      tl.fromTo("#hero-pour", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 16.3);
      /* cursor finds the CTA, hover sweep, press */
      tl.fromTo("#hero-cursor", { x: 1420, y: 760, opacity: 0 }, { x: 1420, y: 760, opacity: 1, duration: 0.25 }, 17.5);
      tl.fromTo("#hero-cursor", { x: 1420, y: 760 }, { x: 1740, y: 1050, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 17.75);
      tl.fromTo("#hero-ctaFill", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, 18.42);
      tl.fromTo("#hero-ctaArrow", { x: 0 }, { x: 7, duration: 0.32, ease: "power3.out" }, 18.42);
      tl.fromTo("#hero-cta", { scale: 1 }, { scale: 0.95, duration: 0.1, ease: "power2.out", immediateRender: false }, 19.0);
      tl.fromTo("#hero-cta", { scale: 0.95 }, { scale: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, 19.1);
      /* scroll to the How section */
      tl.fromTo("#hero-scroll", { y: 0 }, { y: -1080, duration: 0.75, ease: "power3.inOut" }, 19.6);
      window.__timelines["hero"] = tl;

      /* ---------- three.js scene ---------- */
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let renderAt = null;
      let lastT = 0;
      window.addEventListener("hf-seek", (e) => { lastT = e.detail.time; if (renderAt) renderAt(lastT); });

      const ready = new Promise((res) => {
        if (window.__THREE) res(window.__THREE);
        else window.addEventListener("three-ready", () => res(window.__THREE), { once: true });
      }).then(build);
      window.__hf.buildReady["hero3d"] = ready;

      function hash(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
      function vnoise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      }
      function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= 0.5; } return s; }
      function rnd(i, k) { return hash(i * 17.17 + 3.1, k * 9.73 + 1.7); }
      const mix = (a, b, t) => a + (b - a) * t;

      function radialCanvas() {
        const cv = document.createElement("canvas"); cv.width = cv.height = 256;
        const ctx = cv.getContext("2d"), g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, "rgba(42,14,18,0.55)"); g.addColorStop(0.5, "rgba(42,14,18,0.2)"); g.addColorStop(1, "rgba(42,14,18,0)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256); return cv;
      }

      function build({ THREE, RoomEnvironment, RoundedBoxGeometry, EffectComposer, RenderPass, UnrealBloomPass, ShaderPass, OutputPass }) {
        const loader = new THREE.TextureLoader();
        const load = (u) => new Promise((res, rej) => loader.load(u, res, undefined, rej));
        return Promise.all([load("assets/tex/rind.jpg"), load("assets/tex/cap.jpg")]).then(([rindTex, capTex]) => setup(rindTex, capTex));

        function setup(rindTex, capTex) {
        [rindTex, capTex].forEach((t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; });
        rindTex.wrapS = rindTex.wrapT = THREE.ClampToEdgeWrapping;

        /* main renderer: background, fruit, glass. Opaque, so glass and liquid refract the real background. */
        const canvas = document.getElementById("hero-canvas");
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1); renderer.setSize(1920, 1080, false);
        renderer.toneMapping = THREE.NoToneMapping; // brand grounds must stay exact; highlights handled by bloom
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        const scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        scene.environment = envTex; scene.environmentIntensity = 0.55;
        const camera = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.1, 100);
        const key = new THREE.DirectionalLight(0xfff2e2, 1.5); key.position.set(-4, 6, 6); scene.add(key);
        const rim = new THREE.DirectionalLight(0xe4ecff, 1.1); rim.position.set(5, 3, -5); scene.add(rim);

        /* the split-screen grounds, drawn in screen space behind everything */
        const green = new THREE.Color("#ddebc8"), blush = new THREE.Color("#fff0f2");
        const bgMat = new THREE.ShaderMaterial({
          uniforms: { uSplit: { value: 0.5 }, uA: { value: green }, uB: { value: blush }, uRes: { value: new THREE.Vector2(1920, 1080) } },
          vertexShader: "void main(){ gl_Position = vec4(position.xy, 1.0, 1.0); }",
          fragmentShader: "uniform float uSplit; uniform vec3 uA; uniform vec3 uB; uniform vec2 uRes; void main(){ float x = gl_FragCoord.x / uRes.x; gl_FragColor = vec4(x < uSplit ? uA : uB, 1.0); }",
          depthWrite: false, depthTest: false,
        });
        const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat); bg.frustumCulled = false; bg.renderOrder = -10; scene.add(bg);

        /* melon: long axis x, cut plane x = 0; owner's stills as the surfaces (council verdict B-hybrid) */
        const A = 1.55, B = 1.05;
        const rindMat = new THREE.MeshPhysicalMaterial({ map: rindTex, emissiveMap: rindTex, emissive: 0xffffff, emissiveIntensity: 0.42, roughness: 0.48, clearcoat: 0.3, clearcoatRoughness: 0.35 });
        rindMat.onBeforeCompile = (sh) => {
          sh.vertexShader = sh.vertexShader.replace("#include <uv_vertex>", `#include <uv_vertex>
            vec2 projUv = vec2(0.5 + position.x / ${(2 * A).toFixed(3)}, 0.5 + position.y / ${(2 * B).toFixed(3)});
            #ifdef USE_MAP
              vMapUv = projUv;
            #endif
            #ifdef USE_EMISSIVEMAP
              vEmissiveMapUv = projUv;
            #endif`);
        };
        const capMat = new THREE.MeshPhysicalMaterial({ map: capTex, emissiveMap: capTex, emissive: 0xffffff, emissiveIntensity: 0.45, roughness: 0.32, clearcoat: 0.9, clearcoatRoughness: 0.12 });
        function shellGeo(top) { const g = new THREE.SphereGeometry(1, 160, 96, 0, Math.PI * 2, top ? 0 : Math.PI / 2, Math.PI / 2); g.scale(B, A, B); g.rotateZ(-Math.PI / 2); return g; }
        const capGeoL = new THREE.CircleGeometry(B * 0.998, 160); capGeoL.rotateY(Math.PI / 2);
        const capGeoR = new THREE.CircleGeometry(B * 0.998, 160); capGeoR.rotateY(-Math.PI / 2); capGeoR.scale(1, 1, -1);
        const edgeMat = new THREE.MeshPhysicalMaterial({ color: 0xdfe8c8, roughness: 0.3, clearcoat: 1 });
        const melon = new THREE.Group(); scene.add(melon);
        function makeSide(top, capGeo, sign) {
          const side = new THREE.Group(), hinge = new THREE.Group(), body = new THREE.Group();
          hinge.position.set(0, -B, 0); body.position.set(0, B, 0);
          body.add(new THREE.Mesh(shellGeo(top), rindMat));
          body.add(new THREE.Mesh(capGeo, capMat));
          const edge = new THREE.Mesh(new THREE.TorusGeometry(B * 0.995, 0.012, 10, 160), edgeMat); edge.rotation.y = Math.PI / 2; edge.position.x = sign * 0.004; body.add(edge); // lit bevel on the cut edge
          hinge.add(body); side.add(hinge); melon.add(side);
          return { side, hinge, body };
        }
        const L = makeSide(false, capGeoL, -1), R = makeSide(true, capGeoR, 1);

        const arc = new THREE.Curve(); arc.getPoint = (s) => new THREE.Vector3(0, Math.cos(s * Math.PI) * B * 1.004, Math.sin(s * Math.PI) * B * 1.004);
        const SEG = 120, RS = 8, glintGeo = new THREE.TubeGeometry(arc, SEG, 0.008, RS, false);
        const glint = new THREE.Mesh(glintGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 })); melon.add(glint);

        const shadowTex = new THREE.CanvasTexture(radialCanvas());
        const shadowMat = () => new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
        const floorY = -1.47;
        const mShadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shadowMat()); mShadow.rotation.x = -Math.PI / 2; mShadow.position.y = floorY; scene.add(mShadow);
        const gShadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shadowMat()); gShadow.rotation.x = -Math.PI / 2; gShadow.position.y = floorY; scene.add(gShadow);

        /* glass: physical transmission over the real grounds; liquid with red attenuation; ice; bubbles */
        const glassG = new THREE.Group(); scene.add(glassG);
        const GH = 2.25, GR = 0.6;
        const prof = [[0, 0], [GR - 0.04, 0], [GR, 0.04], [GR + 0.02, GH], [GR - 0.005, GH + 0.02], [GR - 0.03, GH], [GR - 0.05, 0.32], [0, 0.3]].map(([r, y]) => new THREE.Vector2(r, y));
        const glass = new THREE.Mesh(new THREE.LatheGeometry(prof, 128), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 1, thickness: 0.35, roughness: 0.02, ior: 1.5, envMapIntensity: 1.6, specularIntensity: 1, clearcoat: 1 }));
        glassG.add(glass);
        const liqH = GH - 0.55;
        const liqGeo = new THREE.CylinderGeometry(GR - 0.065, GR - 0.07, 1, 96); liqGeo.translate(0, 0.5, 0);
        const liqMat = new THREE.MeshPhysicalMaterial({ color: 0xffd0d4, transmission: 1, thickness: 1.1, roughness: 0.04, ior: 1.34, attenuationColor: new THREE.Color(0xd4142f), attenuationDistance: 0.32, envMapIntensity: 1.2 });
        const liquid = new THREE.Mesh(liqGeo, liqMat); liquid.position.y = 0.31; glassG.add(liquid);
        const iceMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 1, thickness: 0.45, roughness: 0.16, ior: 1.31, envMapIntensity: 1.6 });
        const ice = [0, 1, 2].map(() => { const m = new THREE.Mesh(new RoundedBoxGeometry(0.36, 0.32, 0.34, 4, 0.07), iceMat); glassG.add(m); return m; });
        const NB = 90, bubbles = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.05, emissive: 0xffe6e8, emissiveIntensity: 0.5, clearcoat: 1 }), NB);
        glassG.add(bubbles);
        const streamGeo = new THREE.CylinderGeometry(0.06, 0.075, 1, 24); streamGeo.translate(0, -0.5, 0);
        const stream = new THREE.Mesh(streamGeo, liqMat); glassG.add(stream);
        const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.absarc(0, 0, 0.78, Math.PI * 0.34, Math.PI * 0.66, false); sh.lineTo(0, 0);
        const wedgeGeo = new THREE.ExtrudeGeometry(sh, { depth: 0.13, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 2, curveSegments: 24 }); wedgeGeo.translate(0, 0, -0.065);
        const wTex = capTex.clone(); wTex.needsUpdate = true; wTex.repeat.set(1 / 1.56, 1 / 1.56); wTex.offset.set(0.5, 0.5);
        const wedge = new THREE.Mesh(wedgeGeo, [new THREE.MeshPhysicalMaterial({ map: wTex, emissiveMap: wTex, emissive: 0xffffff, emissiveIntensity: 0.4, roughness: 0.3, clearcoat: 0.9 }), new THREE.MeshPhysicalMaterial({ color: 0x2f6b2a, roughness: 0.45 })]);
        glassG.add(wedge);

        /* post: a light bloom on speculars only, and a seeded film grain */
        const composer = new EffectComposer(renderer);
        composer.setPixelRatio(1); composer.setSize(1920, 1080);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(960, 540), 0.28, 0.5, 0.92));
        const grain = new ShaderPass({
          uniforms: { tDiffuse: { value: null }, uT: { value: 0 } },
          vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
          fragmentShader: "uniform sampler2D tDiffuse; uniform float uT; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uT * 7.0) * 43758.5453); } void main(){ vec4 c = texture2D(tDiffuse, vUv); c.rgb += (h(vUv * vec2(1920.0, 1080.0)) - 0.5) * 0.022; gl_FragColor = c; }",
        });
        composer.addPass(grain);
        composer.addPass(new OutputPass());

        /* foreground renderer: seeds and juice fly in front of the type */
        const fxCanvas = document.getElementById("hero-fx");
        const fx = new THREE.WebGLRenderer({ canvas: fxCanvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
        fx.setPixelRatio(1); fx.setSize(1920, 1080, false); fx.setClearColor(0x000000, 0); fx.outputColorSpace = THREE.SRGBColorSpace;
        const fxScene = new THREE.Scene();
        fxScene.environment = new THREE.PMREMGenerator(fx).fromScene(new RoomEnvironment(), 0.04).texture; fxScene.environmentIntensity = 0.8;
        const k2 = new THREE.DirectionalLight(0xfff2e2, 2.0); k2.position.set(-4, 6, 6); fxScene.add(k2);
        const seedGeo = new THREE.SphereGeometry(1, 20, 14); seedGeo.scale(0.07, 0.042, 0.022);
        const NS = 16, seeds = new THREE.InstancedMesh(seedGeo, new THREE.MeshPhysicalMaterial({ color: 0x1b0c0a, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.08 }), NS); fxScene.add(seeds);
        const ND = 64, drops = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshPhysicalMaterial({ color: 0xe0233c, roughness: 0.04, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.4 }), ND); fxScene.add(drops);
        const dummy = new THREE.Object3D();

        renderAt = function (t) {
          const c = sineIO(prog(t, T.cut0, T.cut1));
          const p = p3o(prog(t, T.cut1, T.part1));
          const k = prog(t, T.col0, T.col1), kS = smooth(T.col0, T.col1, t);
          const intro = expoO(prog(t, 0.1, 1.4));
          camera.position.set(0, 1.0, 9.4 - 0.55 * clamp(t / 19));
          camera.lookAt(0, -0.35, 0);
          bgMat.uniforms.uSplit.value = 0.5 * (1 - p2io(k));

          melon.visible = t < T.col1 + 0.4;
          melon.position.set(0, -0.42 + (1 - intro) * -0.6 - 4.2 * kS * kS, 0);
          melon.rotation.set(0.3 + 0.05 * Math.sin(t * 0.6), 0, 0);
          const hingeA = 0.075 * c * (1 - p), lift = 0.08 * Math.sin(Math.PI * p);
          L.hinge.rotation.z = hingeA; R.hinge.rotation.z = -hingeA;
          L.side.position.set(-0.7 * p - 1.2 * kS, lift, 0); R.side.position.set(0.7 * p + 1.2 * kS, lift, 0);
          L.side.rotation.set(0.25 * k, -0.95 * p, 0.6 * k); R.side.rotation.set(0.25 * k, 0.95 * p, -0.6 * k);
          glint.visible = c > 0 && p < 0.2; glintGeo.setDrawRange(0, Math.round(SEG * c) * RS * 6);
          glint.material.opacity = 0.9 * (1 - smooth(0.85, 1, c));
          const mS = 1 - smooth(T.col0, T.col0 + 0.8, t);
          mShadow.scale.set((3.4 + 1.6 * p) * mS + 0.001, 1.3 * mS + 0.001, 1);

          for (let i = 0; i < NS; i++) {
            const te = T.seed0 + i * 0.13, life = (t - te) / 2.3;
            if (life < 0 || life > 1) dummy.scale.setScalar(0);
            else {
              const e = Math.sin(life * Math.PI / 2), side = i % 2 ? 1 : -1;
              const ox = side * (0.35 + rnd(i, 1) * 0.3), oy = -0.5 + (rnd(i, 2) - 0.5) * 1.2;
              dummy.position.set(ox * (1 - e) + Math.sin(life * 6 + i) * 0.14 + side * e * (0.4 + rnd(i, 4) * 1.6), oy + e * 4.6, 0.7 + e * 1.4);
              dummy.rotation.set(life * 8 + i, life * 5 + i * 2, life * 6);
              dummy.scale.setScalar((0.9 + rnd(i, 3) * 0.6) * (1 - smooth(0.85, 1, life)));
            }
            dummy.updateMatrix(); seeds.setMatrixAt(i, dummy.matrix);
          }
          seeds.instanceMatrix.needsUpdate = true;
          for (let i = 0; i < ND; i++) {
            let vis = false;
            if (i < 32) {
              const te = T.cut0 + 0.25 + (i / 32) * (T.cut1 - T.cut0 - 0.4), dt = t - te;
              if (dt >= 0 && dt < 1.0) {
                const ce = sineIO(prog(te, T.cut0, T.cut1)), yl = 1 - 2 * ce, zl = Math.sqrt(Math.max(0, 1 - yl * yl));
                const oy = -0.42 + yl * Math.cos(0.3) - zl * Math.sin(0.3), oz = yl * Math.sin(0.3) + zl * Math.cos(0.3) + 0.05;
                const vx = (rnd(i, 4) - 0.5) * 1.6, vy = 0.8 + rnd(i, 5) * 1.4, vz = 0.6 + rnd(i, 6) * 1.2;
                dummy.position.set(vx * dt, oy + vy * dt - 4.9 * dt * dt, oz + vz * dt);
                dummy.scale.setScalar((0.018 + rnd(i, 7) * 0.026) * (1 - smooth(0.7, 1, dt))); vis = true;
              }
            } else {
              const j = i - 32, te = T.cut1 + j * 0.012, dt = t - te;
              if (dt >= 0 && dt < 1.2) {
                const side = j % 2 ? 1 : -1;
                const vx = side * (1.2 + rnd(j, 8) * 1.8), vy = 0.8 + rnd(j, 9) * 2.4, vz = 0.4 + rnd(j, 10) * 1.8;
                dummy.position.set(side * 0.1 + vx * dt, -0.42 + (rnd(j, 11) - 0.5) * 1.4 + vy * dt - 4.9 * dt * dt, 0.3 + vz * dt);
                dummy.scale.setScalar((0.02 + rnd(j, 12) * 0.035) * (1 - smooth(0.8, 1.2, dt))); vis = true;
              }
            }
            if (!vis) dummy.scale.setScalar(0);
            dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); drops.setMatrixAt(i, dummy.matrix);
          }
          drops.instanceMatrix.needsUpdate = true;

          const g = expoO(prog(t, T.glass0, T.glass1));
          glassG.visible = t >= T.glass0;
          glassG.position.set(0, floorY - 5 * (1 - g), 0);
          glassG.rotation.set(0, -0.3 + 0.12 * clamp((t - T.glass0) / 7), 0);
          const fill = sineIO(prog(t, T.pour0 + 0.15, T.pour1)), surf = 0.31 + liqH * fill;
          liquid.scale.y = Math.max(0.0001, liqH * fill); liquid.visible = fill > 0.002;
          ice.forEach((m, i) => {
            const y = Math.max(0.52 + i * 0.05, surf - 0.2 - i * 0.12) + 0.02 * Math.sin(t * 1.7 + i * 2);
            m.position.set([-0.18, 0.2, -0.02][i], y, [0.12, -0.08, -0.22][i]);
            m.rotation.set(0.3 + i, 0.6 * i + 0.1 * Math.sin(t + i), 0.2 * i);
          });
          const s0 = prog(t, T.pour0, T.pour0 + 0.3), s1 = prog(t, T.pour1 - 0.3, T.pour1);
          const top = 6 - (6 - surf) * s1, bot = 6 - (6 - surf) * s0;
          stream.visible = t > T.pour0 && t < T.pour1 && top - bot > 0.01;
          stream.position.set(-0.08, top, 0.05); stream.scale.set(1 + 0.08 * Math.sin(t * 40), Math.max(0.001, top - bot), 1);
          for (let i = 0; i < NB; i++) {
            const a = rnd(i, 13) * Math.PI * 2, rr = Math.sqrt(rnd(i, 14)) * (GR - 0.14), sp = 0.35 + rnd(i, 15) * 0.5, ph = rnd(i, 16);
            const h = surf - 0.34, y = 0.34 + ((ph + (t - T.pour0) * sp / Math.max(h, 0.2)) % 1) * h;
            const on = t > T.pour0 + 0.6 && h > 0.15;
            dummy.position.set(Math.cos(a) * rr + 0.02 * Math.sin(t * 3 + i), y, Math.sin(a) * rr);
            dummy.scale.setScalar(on ? 0.01 + rnd(i, 17) * 0.018 : 0);
            dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); bubbles.setMatrixAt(i, dummy.matrix);
          }
          bubbles.instanceMatrix.needsUpdate = true;
          const w = prog(t, T.wedge0, T.wedge1);
          wedge.visible = t > T.wedge0;
          wedge.position.set(0.12, GH - 0.62 + 2.5 * (1 - backO(w)), 0.0); wedge.rotation.set(0.1, -0.35, -0.62 + 0.5 * (1 - w));
          gShadow.scale.set(2.0 * g + 0.001, 0.8 * g + 0.001, 1);

          grain.uniforms.uT.value = Math.floor(t * 30) / 30;
          composer.render();
          fx.render(fxScene, camera);
        };
        return renderer.compileAsync(scene, camera).then(() => renderAt(lastT));
        }
      }
    })();
  </script>
</template>
