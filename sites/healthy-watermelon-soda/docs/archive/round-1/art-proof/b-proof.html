import * as THREE from 'three';

const A = 1.6, B = 1.03, C = 1.24;          // ellipsoid radii: long axis x, height y, depth z (cut face is 2C x 2B, photo aspect 1.20)
const BEV = 0.035, EB = 0.045;              // bevel depth (fraction of radius) and its width along x (fraction of A)
const W = 1920, H = 1080;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
camera.position.set(0, 2.5, 8.4); camera.lookAt(0, -0.25, 0);

// ---------- geometry: half shell (x side*>=0) built directly, never mirrored with negative scale ----------
function orient(geo, test) {             // make winding face 'test' (outward) direction; checks a real triangle
  const p = geo.attributes.position, idx = geo.index.array;

}
function shell(side, NA = 90, NP = 160) {

    const al = (Math.PI / 2) * Math.pow(i / NA, 1.7);
    const xn = Math.sin(al), R0 = Math.cos(al);
    const k = Math.max(0, 1 - xn / EB), R = R0 * (1 - BEV * k * k);   // rounded lip into the cut
    for (let j = 0; j < NP; j++) { const f = j / NP * Math.PI * 2; pos.push(side * A * xn, B * R * Math.cos(f), C * R * Math.sin(f)); }

    const a = i * NP + j, b = i * NP + (j + 1) % NP, c = (i + 1) * NP + j, d = (i + 1) * NP + (j + 1) % NP;
    ind.push(a, b, c, b, d, c);
  }
  for (let j = 0; j < NP; j++) ind.push((NA - 1) * NP + j, (NA - 1) * NP + (j + 1) % NP, pole);

uniform vec3 uABC; uniform float uEB; uniform float uBev; uniform float uOpen;
varying vec3 vP; varying vec3 vN; varying vec3 vW;
void main(){

  float f = 1.0 - uBev * k * k;

const VS = `
varying vec3 vP; varying vec3 vN; varying vec3 vW;

const LIGHT = `
uniform vec3 uL;

const RIND_FS = `
uniform sampler2D uRind; uniform vec3 uABC; uniform float uEB; uniform float uOpen; uniform float uCrack;

// bubbles: camera-facing quads drawn as tiny refractive spheres; vJ blends a juice bead into a clear bubble

attribute vec4 aPS; attribute vec2 aJA;
varying vec2 vQ; varying float vJ; varying float vA;
void main(){

const loader = new THREE.TextureLoader();

function pose(t) {

  const dip = 0.012 * Math.sin(Math.PI * clamp((t - 0.7) / 0.35, 0, 1));   // a small give as the knife goes through

}
const mCache = new Map();
const _mg = new THREE.Matrix4(), _mp = new THREE.Matrix4();

      uniforms: { uRind: { value: rind }, uABC: { value: new THREE.Vector3(A, B, C) }, uEB: { value: EB }, uBev: { value: BEV }, uOpen, uCrack, uL } });
    const capMat = new THREE.ShaderMaterial({ vertexShader: VS, fragmentShader: CAP_FS,
      uniforms: { uFace: { value: face }, uABC: { value: new THREE.Vector3(A, B, C) }, uSide: { value: side }, uFlip: { value: side > 0 ? 1 : -1 }, uR: { value: 1 - BEV },
        uTexel: { value: new THREE.Vector2(1 / face.image.width, 1 / face.image.height) }, uL } });
    pivot.add(new THREE.Mesh(shell(side), rindMat), new THREE.Mesh(cap(side), capMat));
    pivot.matrixAutoUpdate = false;
    group.add(pivot); halves.push({ side, pivot });
  }
  renderer.compile(scene, camera);
  window.renderAt(0);
})();

// 0-0.45 whole melon turning; 0.45-0.95 a wet knife line runs down the rind; 0.95-2.8 halves swing open,
// faces start to fizz, juice beads lift off; ~3.0 symmetric hero pose; after that the camera keeps easing in
// and the fizz keeps rising (continues past 5 s)
window.renderAt = (t) => {
  const p = pose(t);
  uOpen.value = p.open; uCrack.value = p.crack;
  const push = smoother((t - 1.2) / 7.0);
  camera.position.set(0.0, 2.35 - 0.25 * push, 8.6 - 0.9 * push);
  camera.lookAt(0, 0.2 - 0.05 * push, 0);
  group.matrixWorld.identity();
  const blobs = [];
  for (const h of halves) {
    const m = halfMatrix(t, h.side);
    h.pivot.matrix.copy(m); h.pivot.matrixWorld.copy(m);
    for (const c of h.pivot.children) c.matrixWorld.multiplyMatrices(m, c.matrix);
    const cen = new THREE.Vector3(h.side * A * 0.4, 0, 0).applyMatrix4(m);
    blobs.push([cen.x, cen.z, p.g + h.side * p.ang]);
  }
  group.matrixAutoUpdate = false;
  for (const h of halves) for (const c of h.pivot.children) c.matrixAutoUpdate = false;
  const u = shadow.material.uniforms;
  u.uB0.value.set(blobs[0][0], blobs[0][1], blobs[0][2], 0); u.uB1.value.set(blobs[1][0], blobs[1][1], blobs[1][2], 0);
  u.uR0.value.set(A * 0.55, C * 0.85); u.uR1.value.set(A * 0.55, C * 0.85);
  updateFizz(t);
  scene.matrixWorldAutoUpdate = false;
  shadow.updateMatrixWorld(); bubbles.updateMatrixWorld(); camera.updateMatrixWorld();
  renderer.render(scene, camera);
};
</script></body></html>
